name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sheet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Sheet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdmcCarthy/kit-relief
          path: Relief
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Fetch Relief tile data (north_sea only, from a pinned release, 26 MB, checksummed)
        working-directory: Relief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked python scripts/fetch_data.py north_sea --tag data-2026-11-09-gebco --dest data/out
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
